name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y clang clang-tidy cppcheck valgrind

      - name: Build (dev)
        run: make dev

      - name: Lint
        run: make lint

      - name: Test (ASan/UBSan)
        run: make test

      - name: Test (real clock)
        run: make test-real-clock

      - name: Test (release)
        run: make test-release

      - name: Test (TSan)
        run: make test-tsan

      - name: Test (Valgrind)
        run: make valgrind

      - name: Build examples
        run: make examples

  build-and-test-openbsd-amd64:
    name: OpenBSD amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test in OpenBSD
        uses: vmactions/openbsd-vm@v1.4.6
        with:
          usesh: true
          release: "7.9"
          run: |
            pkg_add -I clang-tools-extra cppcheck
            make dev
            MALLOC_OPTIONS=CFGJ make lint
            MALLOC_OPTIONS=CFGJ make test || {
              echo "make test failed; collecting backtrace from build/tests/run_tests"
              if ! command -v gdb >/dev/null 2>&1; then
                pkg_add -I gdb || doas pkg_add -I gdb || true
              fi
              if command -v gdb >/dev/null 2>&1; then
                gdb -q -batch \
                  -ex run \
                  -ex "thread apply all bt full" \
                  -ex "info registers" \
                  -ex "x/16i \$pc" \
                  --args build/tests/run_tests || true
              elif command -v lldb >/dev/null 2>&1; then
                printf '%s\n' \
                  'settings set interpreter.stop-command-source-on-error false' \
                  'run' \
                  'thread backtrace all' \
                  'register read' \
                  'disassemble --frame' \
                  'memory read --format x --size 8 --count 16 $sp' \
                  'quit' > /tmp/lldb_cmds.txt
                lldb -b -s /tmp/lldb_cmds.txt -- build/tests/run_tests || true
              fi
              exit 1
            }
            MALLOC_OPTIONS=CFGJ make test-real-clock
            MALLOC_OPTIONS=CFGJ make test-release
            MALLOC_OPTIONS=CFGJ make examples

  build-and-test-openbsd-arm64:
    name: OpenBSD arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test in OpenBSD
        uses: vmactions/openbsd-vm@v1.4.6
        with:
          usesh: true
          arch: aarch64
          release: "7.9"
          run: |
            pkg_add -I clang-tools-extra cppcheck
            make dev
            MALLOC_OPTIONS=CFGJ make lint
            MALLOC_OPTIONS=CFGJ make test || {
              echo "make test failed; collecting backtrace from build/tests/run_tests"
              if ! command -v gdb >/dev/null 2>&1; then
                pkg_add -I gdb || doas pkg_add -I gdb || true
              fi
              if command -v gdb >/dev/null 2>&1; then
                gdb -q -batch \
                  -ex run \
                  -ex "thread apply all bt full" \
                  -ex "info registers" \
                  -ex "x/16i \$pc" \
                  --args build/tests/run_tests || true
              elif command -v lldb >/dev/null 2>&1; then
                printf '%s\n' \
                  'settings set interpreter.stop-command-source-on-error false' \
                  'run' \
                  'thread backtrace all' \
                  'register read' \
                  'disassemble --frame' \
                  'memory read --format x --size 8 --count 16 $sp' \
                  'quit' > /tmp/lldb_cmds.txt
                lldb -b -s /tmp/lldb_cmds.txt -- build/tests/run_tests || true
              fi
              exit 1
            }
            MALLOC_OPTIONS=CFGJ make test-real-clock
            MALLOC_OPTIONS=CFGJ make test-release
            MALLOC_OPTIONS=CFGJ make examples
